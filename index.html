<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chemistry Lab Portfolio</title>
<meta name="description" content="Our semestral chemistry laboratory portfolio: videos, data and write-ups from all 8 lab activities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=2">
<style>
  .vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;align-content:center;gap:22px;transition:opacity .55s ease}
  .loader.done{opacity:0;pointer-events:none}
  .loader svg{width:min(240px,60vw);height:auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(120,255,170,.55))}
  .loader p{margin:0;font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--phos);text-shadow:0 0 8px rgba(120,255,170,.6)}
  .loader .nuc{transform-origin:0 0;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  @media (prefers-reduced-motion:reduce){.loader .nuc{animation:none}}
</style>
</head>
<body>
<div id="loader" class="loader crt" role="status" aria-live="polite">
  <svg viewBox="-120 -120 240 240" aria-hidden="true">
    <defs>
      <path id="orbit" d="M100,0 A100,34 0 1,1 -100,0 A100,34 0 1,1 100,0"/>
    </defs>
    <g fill="none" stroke="#A6F3C4" stroke-width="2.6">
      <use href="#orbit"/>
      <use href="#orbit" transform="rotate(60)"/>
      <use href="#orbit" transform="rotate(-60)"/>
    </g>
    <g class="nuc">
      <circle r="24" fill="none" stroke="#A6F3C4" stroke-width="1.4" stroke-dasharray="3 4" opacity=".8"/>
      <circle cx="-7" cy="-6" r="9" fill="#FF8F7E"/>
      <circle cx="7" cy="-7" r="9" fill="#5CCB89"/>
      <circle cx="-8" cy="7" r="9" fill="#5CCB89"/>
      <circle cx="8" cy="6" r="9" fill="#FF8F7E"/>
      <circle cx="0" cy="0" r="9" fill="#FF8F7E"/>
    </g>
    <g fill="#D8F65A">
      <circle r="7"><animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
      <g transform="rotate(60)"><circle r="7"><animateMotion dur="1.7s" begin="-0.57s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
      <g transform="rotate(-60)"><circle r="7"><animateMotion dur="1.7s" begin="-1.13s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle></g>
    </g>
  </svg>
  <p>Loading lab data…</p>
</div>
<div id="root"></div>
<noscript>This site needs JavaScript to show the experiments.</noscript>
<script src="app.js?v=2"></script>
</body>
</html>
